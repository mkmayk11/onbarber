{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-screen px-4 py-10 bg-[#121214]">
    <div class="w-full max-w-2xl p-8 space-y-6 bg-[#1a1a1e] border border-white/10 rounded-2xl shadow-2xl text-gray-100">
        <div class="text-center">
            <h2 class="text-2xl font-bold text-emerald-400">Configure sua Barbearia & Estética</h2>
            <p class="text-xs text-gray-400 mt-1">Escolha o nome, logotipo, as cores dos textos e a cor de fundo do seu site</p>
        </div>

        <form class="space-y-6" method="POST" enctype="multipart/form-data">
            <div>
                <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Nome da Barbearia</label>
                <input type="text" name="name" required placeholder="Ex: Barbearia VIP" class="w-full px-4 py-3 bg-[#121214] border border-white/10 rounded-xl text-sm text-white">
            </div>

            <div>
                <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Logotipo / Imagem</label>
                <input type="file" name="shop_image" accept="image/*" class="w-full text-xs text-gray-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-500/20 file:text-emerald-400">
            </div>

            <!-- Temas de Cores dos Textos/Detalhes -->
            <div>
                <label class="block text-xs uppercase text-gray-400 font-semibold mb-2">Cor dos Textos e Detalhes</label>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    {% for theme in themes %}
                    <label class="relative flex items-center p-3 rounded-xl border border-white/10 bg-[#121214] cursor-pointer hover:border-white/30 has-[:checked]:border-emerald-500 transition-all">
                        <input type="radio" name="theme_id" value="{{ theme.id }}" {% if loop.first %}checked{% endif %} class="hidden">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-tr {{ theme.bg_gradient }} shrink-0 border border-white/20"></div>
                        <span class="ml-3 text-xs font-bold text-white">{{ theme.name }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <!-- Cores de Fundo -->
            <div>
                <label class="block text-xs uppercase text-gray-400 font-semibold mb-2">Cor de Fundo do Site</label>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    {% for key, bg in backgrounds.items() %}
                    <label class="relative flex items-center p-3 rounded-xl border border-white/10 bg-[#121214] cursor-pointer hover:border-white/30 has-[:checked]:border-emerald-500 transition-all">
                        <input type="radio" name="bg_id" value="{{ key }}" {% if loop.first %}checked{% endif %} class="hidden">
                        <span class="text-xs font-bold text-white">{{ bg.name }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl shadow-lg transition-all">
                CRIAR E ENTRAR NO PAINEL
            </button>
        </form>
    </div>
</div>
{% endblock %}
