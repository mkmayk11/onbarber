{% extends "base_app.html" %}
{% set active_tab = 'perfil' %}
{% block main_content %}
<div class="space-y-6">
    <div class="bg-cardBg p-6 rounded-2xl border border-white/5 shadow-xl max-w-xl space-y-4">
        <h3 class="text-lg font-bold text-white">Seu Perfil de Cliente</h3>
        <div class="flex items-center space-x-4 pb-4 border-b border-white/5">
            <img src="{{ current_user.avatar_url }}" class="w-16 h-16 rounded-full object-cover border-2 border-emerald-500">
            <div>
                <h4 class="text-base font-bold text-white">{{ current_user.name }}</h4>
                <p class="text-xs text-gray-400">{{ current_user.email }}</p>
            </div>
        </div>
        <div>
            <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Saldo em Conta</label>
            <input type="text" readonly value="R$ {{ '%.2f'|format(current_user.balance) }}" class="w-full px-4 py-3 bg-darkBg border border-white/10 rounded-xl text-sm text-emerald-400 font-bold">
        </div>
        <div>
            <label class="block text-xs uppercase text-gray-400 font-semibold mb-1">Pontos Acumulados</label>
            <input type="text" readonly value="{{ current_user.points }} Pontos" class="w-full px-4 py-3 bg-darkBg border border-white/10 rounded-xl text-sm text-amber-400 font-bold">
        </div>
    </div>
</div>
{% endblock %}
